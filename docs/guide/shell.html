@page { size: A4; margin: 18mm 17mm 20mm; }

* { box-sizing: border-box; }
html { font-size: 10.4pt; }

tr { break-inside: avoid; }
.diagram { margin: .8rem 0 1.1rem; break-inside: avoid; text-align: center; }
