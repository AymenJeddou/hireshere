name: daily
on:
  schedule:
    - cron: "17 4 * * *" # once a day, 04:17 UTC
  workflow_dispatch:

concurrency:
  group: daily
  cancel-in-progress: false

permissions:
  contents: write # needed to create and update the data-latest release

env:
  GH_TOKEN: ${{ github.token }}
  TAG: data-latest
  JOBS_DB: jobs.db
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
      - run: uv sync --locked --no-dev

      - name: Download previous database
        run: |
          if gh release download "$TAG" --pattern jobs.db.gz; then
            gunzip jobs.db.gz
          else
            echo "No previous database, starting fresh."
          fi

      - name: Fetch
        run: uv run python -m pipeline.run fetch

      # Classify new jobs through the Batch API (half price). Collect results for up to
      # 30 minutes; anything still running is collected by the next day's run.
      - name: Classify
        if: env.GEMINI_API_KEY != ''
        run: |
          uv run python -m pipeline.run classify-collect
          uv run python -m pipeline.run classify --batch
          for i in $(seq 30); do
            out=$(uv run python -m pipeline.run classify-collect)
            echo "$out"
            echo "$out" | grep -qE "collected|No open batches|FAILED|CANCELLED|EXPIRED" && break
            sleep 60
          done

      - name: Stats
        run: uv run python -m pipeline.run stats

      # Rebuild and publish the site from today's data.
      - name: Export
        run: |
          uv run python -m pipeline.run export
          # Fail loudly (GitHub emails the owner) rather than deploy an empty site.
          uv run python -c "import json; m = json.load(open('site/src/data/meta.json')); n = sum(sum(c['counts'].values()) for c in m['countries'].values()); assert n > 0, 'export has no jobs'; print(n, 'jobs exported')"

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build and deploy site
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: site
        run: |
          npm ci --no-audit --no-fund
          npx astro build
          npx wrangler pages deploy --branch main --commit-dirty=true

      - name: Upload database
        run: |
          gzip -9 -k jobs.db
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --title "Latest data" --latest=false \
            --notes "Rolling SQLite snapshot updated by the daily workflow. Not a code release."
          gh release upload "$TAG" jobs.db.gz --clobber
