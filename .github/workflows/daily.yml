name: daily
on:
  schedule:
    - cron: "17 */4 * * *" # every 4 hours: fresher jobs, more free AI capacity a day
  workflow_dispatch:

concurrency:
  group: daily
  cancel-in-progress: false

permissions:
  contents: write # needed to create and update the data-latest release

env:
  GH_TOKEN: ${{ github.token }}
  TAG: data-latest
  JOBS_DB: jobs.db
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
  UNSUBSCRIBE_SECRET: ${{ secrets.UNSUBSCRIBE_SECRET }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHANNELS: ${{ secrets.TELEGRAM_CHANNELS }}
  # The snapshot holds full job descriptions, so it is stored encrypted on the release.
  DB_PASSPHRASE: ${{ secrets.DB_PASSPHRASE }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
      - run: uv sync --locked --no-dev

      - name: Download previous database
        run: |
          if [ -n "$DB_PASSPHRASE" ] && gh release download "$TAG" --pattern jobs.db.gz.enc; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:DB_PASSPHRASE -in jobs.db.gz.enc | gunzip > jobs.db
          elif gh release download "$TAG" --pattern jobs.db.gz; then
            gunzip jobs.db.gz  # older unencrypted snapshot
          else
            echo "No previous database, starting fresh."
          fi

      - name: Fetch
        id: fetch
        run: uv run python -m pipeline.run fetch

      # Classify new jobs on free tiers, one request at a time (no billing since 2026-10-11):
      # Gemini and Groq free tiers side by side, 15 minutes per run (the run repeats every 4 hours).
      # Whatever is left waits for the next run. classify-collect picks up any old batch.
      - name: Classify
        if: env.GEMINI_API_KEY != ''
        env:
          GEMINI_RPM: "14"
          GROQ_RPM: "4"
          CLASSIFY_MINUTES: "15"
        run: |
          uv run python -m pipeline.run classify-collect
          uv run python -m pipeline.run classify --limit 500 --yes

      - name: Stats
        run: uv run python -m pipeline.run stats

      # Logos first: the export records which companies have one.
      - name: Logos for new companies
        continue-on-error: true
        run: uv run python -m pipeline.logos

      # Rebuild and publish the site from today's data.
      - name: Export
        run: |
          uv run python -m pipeline.run export
          # Fail loudly (GitHub emails the owner) rather than deploy an empty site.
          uv run python -c "import json; m = json.load(open('site/src/data/meta.json')); n = m['jobs']; assert n > 0, 'export has no jobs'; print(n, 'jobs exported')"

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build and deploy site
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: site
        run: |
          npm ci --no-audit --no-fund
          npx astro build
          # Cloudflare sometimes fails to publish with an internal error: retry once.
          npx wrangler pages deploy --branch main --commit-dirty=true ||
            (sleep 30 && npx wrangler pages deploy --branch main --commit-dirty=true)

      - name: Email alerts
        if: env.RESEND_API_KEY != ''
        run: uv run python -m pipeline.run alerts

      - name: Telegram channels
        if: env.TELEGRAM_BOT_TOKEN != ''
        continue-on-error: true
        run: uv run python -m pipeline.run telegram

      # Keep the day's fetch and classification even when a later step (deploy, alerts) fails.
      - name: Upload database
        if: always() && steps.fetch.outcome == 'success'
        run: |
          gzip -9 -k jobs.db
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --title "Latest data" --latest=false \
            --notes "Rolling SQLite snapshot updated by the daily workflow. Not a code release."
          if [ -n "$DB_PASSPHRASE" ]; then
            openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:DB_PASSPHRASE -in jobs.db.gz -out jobs.db.gz.enc
            gh release upload "$TAG" jobs.db.gz.enc --clobber
            gh release delete-asset "$TAG" jobs.db.gz --yes 2>/dev/null || true
          else
            gh release upload "$TAG" jobs.db.gz --clobber
          fi

      # Check the live site like a visitor; a failure fails the run, so GitHub emails the owner.
      - name: Check the live site
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: uv run python -m pipeline.healthcheck
