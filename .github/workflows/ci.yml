name: ci
on:
  push:
  pull_request:

# Read-only token; a newer push to the same branch cancels the older run.
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  site:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
      - run: uv sync --locked --no-dev
      # An empty database still exports valid JSON, so the site build is checked on every push.
      - run: uv run python -m pipeline.run export
        env:
          JOBS_DB: ci-empty.db
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - working-directory: site
        run: |
          npm ci --no-audit --no-fund
          npm run check:i18n
          npx astro build
